# Production stack on the EC2 host. Only Caddy publishes ports; the app is reachable
# solely through Caddy on the private compose network.
services:
  app:
    build: ..
    env_file: [.env]
    environment:
      RINGBREAKER_ROOT_PATH: /live
      RINGBREAKER_MAX_INVESTIGATIONS_PER_HOUR: "15"
    volumes: ["/opt/ringbreaker-state:/app/state"]
    restart: unless-stopped
    mem_limit: 700m
    read_only: false
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8.4
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data: {}
  caddy_config: {}

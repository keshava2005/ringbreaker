<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RingBreaker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail (nav) + scrolling workspace; case view = flow canvas left, evidence column right.
   Direction: night-shift financial-intelligence console. Ink-blue neutrals, money moves in warm gold. */
:root{
  --bg:#0a0d13; --surface:#11161f; --surface-2:#171e2a; --surface-3:#1e2735; --line:#222c3c; --line-2:#2d3a4f;
  --ink:#e6ebf3; --ink-2:#a5b0c4; --ink-3:#6c7891; --accent:#8fb4ff; --accent-ink:#0a0d13;
  --gold:#ffcf6b; --gold-dim:rgba(255,207,107,.16);
  --r-collector:#1fb889; --r-layer:#9085e9; --r-aggregator:#d55181; --r-cashout:#3987e5; --r-victim:#58657c; --r-sink:#c3cad6;
  --crit:#e45858; --serious:#ec835a; --warn:#fab219; --good:#21b34a;
  --display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rail:220px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:14px;font-family:var(--sans);font-weight:600;letter-spacing:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
  padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--surface-3);color:var(--ink);box-shadow:inset 2px 0 0 var(--gold)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--ink-3)}
.rail-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:grid;gap:6px}
.env{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(33,179,74,.15)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(250,178,25,.15)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px max(20px, env(safe-area-inset-right,0px)) 10px 24px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;position:relative}
.search input{width:250px;max-width:42vw;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 30px}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--ink-3)}
.badge-synth{font:500 11px var(--mono);color:var(--gold);border:1px solid rgba(255,207,107,.35);background:var(--gold-dim);padding:3px 8px;border-radius:999px;white-space:nowrap}
.view{padding:22px max(20px, env(safe-area-inset-right,0px)) 60px 24px;display:none;min-width:0}
.view.on{display:block}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.vhead p{margin:4px 0 0;color:var(--ink-2);max-width:760px}

/* building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.panel>.pb{padding:12px 16px 16px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e,.g-3{grid-template-columns:1fr}}
.kpi{padding:14px 16px;display:grid;gap:2px;position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--ink-2)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.gold .v{color:var(--gold)}
.kpi .spark{position:absolute;right:10px;bottom:10px;opacity:.7}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
.sev{--c:var(--ink-3)}
.sev::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.sev.Critical{--c:var(--crit);color:#ff9b9b;border-color:rgba(228,88,88,.45);background:rgba(228,88,88,.10)}
.sev.High{--c:var(--serious);color:#ffb796;border-color:rgba(236,131,90,.4);background:rgba(236,131,90,.08)}
.sev.Medium{--c:var(--warn);color:#ffd27a;border-color:rgba(250,178,25,.35)}
.sev.Low{--c:var(--ink-3);color:var(--ink-2)}
.status{color:var(--ink-2)}
.status.Frozen,.status.STR\ filed{color:#8fe3a8;border-color:rgba(33,179,74,.4)}
.status.Investigating,.status.Escalated{color:var(--accent);border-color:rgba(143,180,255,.4)}
.status.False\ positive{color:var(--ink-3)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.role i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#ffb4b4;border-color:rgba(228,88,88,.45)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--surface-3);color:var(--ink);border-color:var(--ink-3)}
select.sel,input.inp{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.t th.sort{cursor:pointer}.t th.sort:hover{color:var(--ink)}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--surface-2)}
.t td.r,.t th.r{text-align:right}
.sevbar{width:3px;padding:0!important;background:var(--c)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend i.ln{width:14px;height:2px;border-radius:2px}
.legend i.sq{border-radius:2px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:280px;opacity:0;transition:opacity .08s}
.tip b{font-variant-numeric:tabular-nums}
.tip .h{color:var(--ink-2);margin-bottom:3px}
svg text{fill:var(--ink-3);font-size:11px;font-family:var(--sans)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

/* overview */
.netwrap{position:relative;height:420px}
.netwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.queue{display:grid}
.qrow{display:grid;grid-template-columns:3px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.qrow:hover{background:var(--surface-2)}
.qrow .s{align-self:stretch;border-radius:2px;background:var(--c)}
.qrow .t1{font-weight:600}.qrow .t2{font-size:12px;color:var(--ink-3)}
.src-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0}
.src-bar i{display:block;height:100%}

/* case view */
.case-head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:6px}
.case-head h1{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:0}
.case-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:11px 14px}
.facts .k{font-size:11.5px;color:var(--ink-3)}.facts .v{font-family:var(--display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.facts .v.gold{color:var(--gold)}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1180px){.case-grid{grid-template-columns:1fr}}
.flow{position:relative;height:560px;border-radius:0 0 12px 12px;overflow:hidden;
  background:radial-gradient(1200px 500px at 40% 0%,rgba(143,180,255,.06),transparent 60%),var(--surface)}
.flow svg,.flow canvas{position:absolute;inset:0;width:100%;height:100%}
.flow canvas{pointer-events:none}
.lanes{position:absolute;inset:10px 0 auto;display:flex;pointer-events:none}
.lanes span{position:absolute;transform:translateX(-50%);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.player{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.player input[type=range]{flex:1;min-width:160px;accent-color:var(--gold)}
.clock{font-family:var(--mono);font-size:12.5px;color:var(--gold);min-width:150px}
.counters{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.counters b{font-family:var(--mono);color:var(--ink);font-weight:500}
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:hover{background:var(--surface-2)}
.mrow .id{font-family:var(--mono);font-size:12.5px}
.mrow .why{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
.score{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px;background:var(--surface-3)}
.score.hi{color:#ffb0b0;background:rgba(228,88,88,.14)}
.score.md{color:#ffd27a;background:rgba(250,178,25,.12)}
/* investigator */
.inv-log{font-family:var(--mono);font-size:12px;background:#070a0f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:280px;overflow:auto;display:grid;gap:8px}
.inv-log .st{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.inv-log .n{color:var(--ink-3)}
.inv-log .tool{color:var(--gold)}
.inv-log .why{color:var(--ink-2);font-family:var(--sans)}
.inv-log .res{grid-column:2;color:var(--ink-3);white-space:pre-wrap;word-break:break-word;max-height:4.5em;overflow:hidden}
.inv-log .blocked{color:#ff9b9b}
.report{display:grid;gap:14px}
.report .headline{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25}
.report ul{margin:0;padding-left:18px;display:grid;gap:6px}
.evidence{display:grid;gap:8px}
.evidence div{border-left:2px solid var(--gold);padding:2px 0 2px 10px}
.evidence b{display:block;font-weight:600}
.evidence span{color:var(--ink-2);font-size:13px}
.str{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:14px;font-size:13px;display:grid;gap:8px}
.str dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0}
.str dt{color:var(--ink-3)}.str dd{margin:0}
.engine{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.typing::after{content:"▍";color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.timeline{display:grid;gap:8px;font-size:12.5px}
.timeline div{display:grid;grid-template-columns:auto 1fr;gap:10px}
/* account */
.gauge{display:flex;align-items:center;gap:16px}
.reasons{display:grid;gap:8px}
.reason{display:grid;grid-template-columns:minmax(130px,1fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.fgrid div{background:var(--surface);padding:9px 12px}
.fgrid .k{font-size:11.5px;color:var(--ink-3)}.fgrid .v{font-family:var(--mono);font-size:13.5px}
/* model lab */
.budget{display:grid;gap:10px}
.budget input[type=range]{width:100%;accent-color:var(--accent)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.vs .card h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vs dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0;font-size:13px}
.vs dt{color:var(--ink-2)}.vs dd{margin:0;font-family:var(--mono);text-align:right}
.note{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:10px}
/* pipeline */
.dag{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;position:relative}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;position:relative;align-content:start}
.stage .kind{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.stage .kind.bronze{color:#d9a066}.stage .kind.silver{color:#c3cad6}.stage .kind.gold{color:var(--gold)}.stage .kind.serve{color:var(--accent)}
.stage .rows{font-size:12px;color:var(--ink-2);display:grid;gap:2px}
.stage .rows b{font-family:var(--mono);color:var(--ink);font-weight:500}
.checks{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:center;font-size:13px}
.check i{font-style:normal;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px}
.check i.pass{color:#8fe3a8;background:rgba(33,179,74,.12)}
.check i.warn{color:#ffd27a;background:rgba(250,178,25,.12)}
pre.code{margin:0;font:12px/1.6 var(--mono);background:#070a0f;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;color:#c9d3e6}
pre.code .kw{color:#8fb4ff}pre.code .fn{color:var(--gold)}pre.code .cm{color:var(--ink-3)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
.toast.on{opacity:1;transform:none}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;padding:18px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px;margin:10px 0}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:25;flex-direction:row;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 6px 0 0}.brand small{display:none}
  .nav{flex-direction:row}.nav a{padding:6px 9px}.nav .count,.rail-foot{display:none}
  .topbar{top:calc(env(safe-area-inset-top,0px) + 52px);padding-left:max(16px,env(safe-area-inset-left,0px))}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search input{width:150px}.badge-synth{display:none}
  .flow{height:440px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#ffcf6b" stroke-width="2.4" stroke-dasharray="52 17" transform="rotate(-38 16 16)"/><circle cx="16" cy="16" r="3.2" fill="#8fb4ff"/><path d="M24 7 L29 2" stroke="#ffcf6b" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div><b>RingBreaker</b><small>Mule network intelligence</small></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#overview" data-v="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="17" r="2.5"/><path d="M8 8.5l3 6.5M16 8l-3 7M8.4 6.7l7.2-.5"/></svg>Command center</a>
      <a href="#cases" data-v="cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M8 5V3h8v2M3 11h18"/></svg>Cases<span class="count" id="navCases"></span></a>
      <a href="#alerts" data-v="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0"/></svg>Flagged accounts<span class="count" id="navAlerts"></span></a>

function histogram(host, hd) {
  const W = Math.max(host.clientWidth || 400, 260), H = 200, m = { l: 40, r: 8, t: 8, b: 26 };
  const x = d3.scaleBand().domain(hd.bins).range([m.l, W - m.r]).padding(.12);
  const y = d3.scaleLog().domain([1, d3.max(hd.all) || 10]).range([H - m.b, m.t]).clamp(true);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H });
  [1, 10, 100, 1000, 10000].filter(t => t <= y.domain()[1]).forEach(t => { svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: cssv("var(--line)") })); const tx = svgEl("text", { x: m.l - 6, y: y(t) + 4, "text-anchor": "end" }); tx.textContent = num(t); svg.append(tx); });
  hd.bins.forEach((b, i) => { const ha = hd.all[i], hm = hd.mules[i];
    if (ha) svg.append(svgEl("rect", { x: x(b), y: y(ha), width: x.bandwidth(), height: H - m.b - y(ha), fill: cssv("var(--ink-3)"), "fill-opacity": .5, rx: 1.5 }));
    if (hm) svg.append(svgEl("rect", { x: x(b) + x.bandwidth() * .2, y: y(hm), width: x.bandwidth() * .6, height: H - m.b - y(hm), fill: cssv("var(--crit)"), rx: 1.5 }));
    if (i % 8 === 0) { const t = svgEl("text", { x: x(b), y: H - 8 }); t.textContent = (+b).toFixed(1); svg.append(t); }
    const hit = svgEl("rect", { x: x(b), y: m.t, width: x.bandwidth(), height: H - m.b - m.t, fill: "transparent" });
    hit.addEventListener("pointermove", e => tip(e, [h("div", { class: "h" }, `score ${(+b).toFixed(3)} – ${(+b + .025).toFixed(3)}`), h("div", {}, h("b", {}, num(ha)), " accounts, ", h("b", {}, num(hm)), " real mules")]));
    hit.addEventListener("pointerleave", e => tip(e, null)); svg.append(hit); });
  const xl = svgEl("text", { x: (W + m.l) / 2, y: H, "text-anchor": "middle" }); xl.textContent = "risk score"; svg.append(xl);
  host.replaceChildren(svg);
}

const SQL_SNIPPET = `<span class="cm">-- How fast does money leave after it lands? (ASOF join)</span>
<span class="kw">CREATE TABLE</span> gold.dwell <span class="kw">AS</span>
<span class="kw">SELECT</span> i.account_id, i.ts, i.amount,
       <span class="fn">date_diff</span>('minute', i.ts, o.ts) <span class="kw">AS</span> dwell_min
<span class="kw">FROM</span> gold.inflow i
<span class="kw">ASOF LEFT JOIN</span> gold.outflow o
  <span class="kw">ON</span> i.account_id = o.account_id <span class="kw">AND</span> o.ts >= i.ts;

<span class="cm">-- Busiest hour of credits (window over a time range)</span>
<span class="kw">SELECT</span> account_id, <span class="fn">MAX</span>(n_1h) <span class="kw">FROM</span> (
  <span class="kw">SELECT</span> account_id, <span class="fn">COUNT</span>(*) <span class="kw">OVER</span> (
    <span class="kw">PARTITION BY</span> account_id <span class="kw">ORDER BY</span> ts
    <span class="kw">RANGE BETWEEN INTERVAL</span> 1 <span class="kw">HOUR PRECEDING AND CURRENT ROW</span>) n_1h
  <span class="kw">FROM</span> gold.inflow) <span class="kw">GROUP BY</span> 1;`;
